version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: taller_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taller_mecanico
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taller_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://taller:taller123@db:5432/taller_mecanico
      JWT_SECRET: cambia_esto_en_produccion
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taller_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
